<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT 重绘动作 · PixelPet</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ed;color:#252830;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0 0 8px}p{color:#656973;line-height:1.7}button,select,input{font:inherit}button,select{padding:9px 14px;border:1px solid #ccc;border-radius:8px;background:white;cursor:pointer}.toolbar{display:flex;gap:12px;margin:24px 0;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:18px}.card{background:white;border:1px solid #deded9;border-radius:14px;overflow:hidden}.card h2{font-size:17px;margin:16px 18px 4px}.stage{height:280px;display:flex;justify-content:center;align-items:end;background-color:#f4f4f2;background-image:linear-gradient(45deg,#e6e6e2 25%,transparent 25%),linear-gradient(-45deg,#e6e6e2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e6e6e2 75%),linear-gradient(-45deg,transparent 75%,#e6e6e2 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.stage img{width:256px;height:256px;object-fit:contain;image-rendering:auto}.card footer{padding:12px 18px;display:flex;gap:10px;align-items:center;color:#747880}.card input{width:100%;min-width:0}.dark .stage{background:#242936}.dark .stage img{filter:none}.frame{white-space:nowrap;font-variant-numeric:tabular-nums}.note{font-size:13px}a{color:#365eaa}
</style>
<main><h1>让她真正动起来</h1><p>v0.7：八帧侧身跑动，680ms 周期，探头注视使用者。拖动进度条可以逐帧检查，切换背景可检查透明边缘。</p>
<div class="toolbar"><button id="play">暂停播放</button><button id="background">深色背景</button><label>速度 <select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option></select></label><span id="status">循环预览</span></div>
<section class="grid" id="grid"><article class="card"><h2>原始角色参考</h2><div class="stage"><img src="../reference_original.png" alt="原始角色"></div><footer>身份参考，不参与动画</footer></article></section>
<p class="note">这是第一版 GPT 重绘素材。关键姿态之间仍可能有细节跳变；人物一致性与动作节奏需要结合实际播放评审。原稿和完整提示词保存在 assets/sheets 与 docs/generation_prompts.json。</p></main>
<script>
const cards=[{"label": "扶眼镜 · 开始专注", "frames": [{"url": "../assets/adjustGlasses/adjustGlasses_01.png", "ms": 100}, {"url": "../assets/adjustGlasses/adjustGlasses_02.png", "ms": 150}, {"url": "../assets/adjustGlasses/adjustGlasses_03.png", "ms": 180}, {"url": "../assets/adjustGlasses/adjustGlasses_04.png", "ms": 360}, {"url": "../assets/adjustGlasses/adjustGlasses_05.png", "ms": 160}, {"url": "../assets/adjustGlasses/adjustGlasses_06.png", "ms": 180}]}, {"label": "坐下 → 打盹 → 站起", "frames": [{"url": "../assets/idle/idle_01.png", "ms": 100}, {"url": "../assets/sitTransition/sitTransition_02.png", "ms": 160}, {"url": "../assets/sitTransition/sitTransition_03.png", "ms": 180}, {"url": "../assets/sitTransition/sitTransition_04.png", "ms": 200}, {"url": "../assets/sitTransition/sitTransition_05.png", "ms": 180}, {"url": "../assets/sleep/sleep_01.png", "ms": 150}, {"url": "../assets/sleep/sleep_03.png", "ms": 800}, {"url": "../assets/sleep/sleep_04.png", "ms": 1000}, {"url": "../assets/sleep/sleep_05.png", "ms": 900}, {"url": "../assets/sleep/sleep_06.png", "ms": 900}, {"url": "../assets/sleep/sleep_01.png", "ms": 120}, {"url": "../assets/sitTransition/sitTransition_05.png", "ms": 160}, {"url": "../assets/sitTransition/sitTransition_04.png", "ms": 180}, {"url": "../assets/sitTransition/sitTransition_03.png", "ms": 180}, {"url": "../assets/sitTransition/sitTransition_02.png", "ms": 170}, {"url": "../assets/idle/idle_01.png", "ms": 160}]}, {"label": "起步 → 左右脚交替 → 停步", "frames": [{"url": "../assets/idle/idle_01.png", "ms": 110}, {"url": "../assets/walk/walk_02.png", "ms": 110}, {"url": "../assets/walk/walk_01.png", "ms": 85}, {"url": "../assets/walk/walk_02.png", "ms": 75}, {"url": "../assets/walk/walk_03.png", "ms": 65}, {"url": "../assets/walk/walk_04.png", "ms": 75}, {"url": "../assets/walk/walk_05.png", "ms": 85}, {"url": "../assets/walk/walk_06.png", "ms": 75}, {"url": "../assets/walk/walk_07.png", "ms": 65}, {"url": "../assets/walk/walk_08.png", "ms": 75}, {"url": "../assets/walk/walk_06.png", "ms": 140}, {"url": "../assets/idle/idle_01.png", "ms": 140}]}, {"label": "拖动 · 慢速侧身跑动", "frames": [{"url": "../assets/walk/walk_01.png", "ms": 95}, {"url": "../assets/walk/walk_02.png", "ms": 85}, {"url": "../assets/walk/walk_03.png", "ms": 75}, {"url": "../assets/walk/walk_04.png", "ms": 85}, {"url": "../assets/walk/walk_05.png", "ms": 95}, {"url": "../assets/walk/walk_06.png", "ms": 85}, {"url": "../assets/walk/walk_07.png", "ms": 75}, {"url": "../assets/walk/walk_08.png", "ms": 85}]}, {"label": "屏幕边缘 · 探头", "frames": [{"url": "../assets/peek/peek_01.png", "ms": 1800}, {"url": "../assets/peek/peek_02.png", "ms": 110}, {"url": "../assets/peek/peek_03.png", "ms": 1500}]}, {"label": "待机", "frames": [{"url": "../assets/idle/idle_01.png", "ms": 1600}, {"url": "../assets/idle/idle_02.png", "ms": 240}, {"url": "../assets/idle/idle_03.png", "ms": 90}, {"url": "../assets/idle/idle_04.png", "ms": 110}, {"url": "../assets/idle/idle_05.png", "ms": 130}, {"url": "../assets/idle/idle_06.png", "ms": 700}]}, {"label": "摸头回应", "frames": [{"url": "../assets/headClick/headClick_01.png", "ms": 140}, {"url": "../assets/headClick/headClick_02.png", "ms": 160}, {"url": "../assets/headClick/headClick_03.png", "ms": 180}, {"url": "../assets/headClick/headClick_04.png", "ms": 450}, {"url": "../assets/headClick/headClick_05.png", "ms": 200}, {"url": "../assets/headClick/headClick_06.png", "ms": 160}]}, {"label": "身体互动", "frames": [{"url": "../assets/bodyClick/bodyClick_01.png", "ms": 120}, {"url": "../assets/bodyClick/bodyClick_02.png", "ms": 160}, {"url": "../assets/bodyClick/bodyClick_03.png", "ms": 180}, {"url": "../assets/bodyClick/bodyClick_04.png", "ms": 450}, {"url": "../assets/bodyClick/bodyClick_05.png", "ms": 200}, {"url": "../assets/bodyClick/bodyClick_06.png", "ms": 180}]}, {"label": "开心动作", "frames": [{"url": "../assets/happy/happy_01.png", "ms": 130}, {"url": "../assets/happy/happy_02.png", "ms": 180}, {"url": "../assets/happy/happy_03.png", "ms": 110}, {"url": "../assets/happy/happy_04.png", "ms": 200}, {"url": "../assets/happy/happy_05.png", "ms": 180}, {"url": "../assets/happy/happy_06.png", "ms": 260}]}];let playing=true,previous=performance.now(),speed=1;const players=[];
for(const card of cards){const element=document.createElement('article');element.className='card';element.innerHTML=`<h2>${card.label}</h2><div class="stage"><img alt="${card.label}"></div><footer><input type="range" min="0" max="${card.frames.length-1}" value="0" aria-label="逐帧预览"><span class="frame"></span></footer>`;document.querySelector('#grid').append(element);const p={frames:card.frames,index:0,elapsed:0,img:element.querySelector('img'),slider:element.querySelector('input'),counter:element.querySelector('.frame')};p.paint=()=>{p.img.src=p.frames[p.index].url;p.slider.value=p.index;p.counter.textContent=`${p.index+1} / ${p.frames.length}`;};p.paint();p.slider.oninput=()=>{playing=false;document.querySelector('#play').textContent='继续播放';p.index=+p.slider.value;p.elapsed=0;p.paint();};for(const f of card.frames){const image=new Image();image.src=f.url;}players.push(p);}
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停播放':'继续播放';};document.querySelector('#background').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'浅色背景':'深色背景';};document.querySelector('#speed').onchange=e=>{speed=+e.target.value;};function tick(now){const dt=Math.min(250,now-previous)*speed;previous=now;if(playing)for(const p of players){p.elapsed+=dt;while(p.elapsed>=p.frames[p.index].ms){p.elapsed-=p.frames[p.index].ms;p.index=(p.index+1)%p.frames.length;p.paint();}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
